# VPS: Traefik + external networks proxy / backend (see docs/DEPLOY-VPS.md).
# cp .env.example .env  # set APP_HOST, secrets, then:
# docker compose build && docker compose up -d
# docker compose exec dms-app php artisan migrate --force

services:
  dms-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: document-management:1.0.0
    container_name: dms-app
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$body=@file_get_contents(\"http://127.0.0.1/up\"); exit($$body===false ? 1 : 0);'",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - dms_storage:/app/storage
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-dms}.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-dms}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-dms}.tls=true"
      - "traefik.http.services.${TRAEFIK_ROUTER_NAME:-dms}.loadbalancer.server.port=80"

  dms-worker:
    image: document-management:1.0.0
    container_name: dms-worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - dms_storage:/app/storage
    networks:
      - backend

  dms-scheduler:
    image: document-management:1.0.0
    container_name: dms-scheduler
    restart: unless-stopped
    env_file:
      - .env
    command:
      [
        "sh",
        "-lc",
        "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done",
      ]
    volumes:
      - dms_storage:/app/storage
    networks:
      - backend

volumes:
  dms_storage:

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:-backend}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
